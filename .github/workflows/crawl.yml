name: Crawl articles

# Runs the RSS crawler on a schedule so the DB stays fresh without manual runs.
# NOTE: GitHub only fires `schedule` for workflow files on the DEFAULT branch
# (main). On a feature branch you can still trigger it manually via
# "Run workflow" (workflow_dispatch); the cron starts once this is merged to main.

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours (UTC) → KST 09:00 / 21:00
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

# Never let two crawls overlap (a slow run + the next tick).
concurrency:
  group: crawl-articles
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Crawl + upsert into Supabase
        env:
          # The crawler reads these from process.env (falls back to .env.local
          # locally, which doesn't exist on the runner — so these are required).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/crawl-articles.mjs

      # 아침 실행(KST 09:00)에서만 뉴스레터를 만든다 — 시간 확인은 스크립트가 한다(KST 06–12시 밖이면 건너뜀).
      # 메일 발송은 RESEND_API_KEY·NEWSLETTER_FROM이 있을 때만. 없으면 사이트(/newsletter)에만 올라간다.
      - name: Daily newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/newsletter.mjs
